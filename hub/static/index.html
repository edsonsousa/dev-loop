<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dev-loop</title>
<link rel="stylesheet" href="/style.css">
<script src="/vendor/vega.min.js"></script>
<script src="/vendor/vega-lite.min.js"></script>
<script src="/vendor/vega-embed.min.js"></script>
</head>
<body>
<header>
  <a class="brand" href="#/live">dev-loop</a>
  <nav>
    <a href="#/live" data-tab="live">Ao vivo <span id="live-count" class="pill" hidden></span></a>
    <a href="#/runs" data-tab="runs">Tarefas</a>
    <a href="#/quality" data-tab="quality">Qualidade</a>
    <a href="#/agents" data-tab="agents">Agentes</a>
  </nav>
  <form id="filters">
    <label>Projeto <select name="project"><option value="">todos</option></select></label>
    <label>Desde <input type="date" name="since"></label>
    <label>Versão <select name="version"><option value="">todas</option></select></label>
  </form>
  <span id="stream" class="stream" title="Conexão ao vivo">●</span>
</header>
<main id="view"></main>
<script src="/app.js"></script>
</body>
</html>
